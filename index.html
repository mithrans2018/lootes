<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Welcome to Lootes</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f8fafc;
      background:
        radial-gradient(ellipse at 50% 15%, #243c5a 0, transparent 55%),
        #101827;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    main { max-width: 620px; }

    .logo {
      display: inline-block;
      margin-bottom: 28px;
      color: #8df0c2;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.14em;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      letter-spacing: -0.05em;
    }

    p {
      margin: 18px 0 32px;
      color: #bdc8d8;
      font-size: 1.15rem;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      padding: 13px 22px;
      border-radius: 999px;
      color: #101827;
      background: #8df0c2;
      font-weight: 700;
      text-decoration: none;
    }

    a:hover { background: #b1f7d6; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-label="Lootes logo">LOOTES</div>
    <h1>Welcome to Lootes</h1>
    <p>Something exciting is on its way. We’re getting things ready—check back soon.</p>
    <a href="mailto:hello@lootes.ca">Get in touch</a>
  </main>
</body>
</html>
